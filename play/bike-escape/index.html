    (function () {
      var tips = [

      var el = document.getElementById('loadTip'), i = Math.floor(Math.random() * tips.length);

      var timer = setInterval(function () {
        if (document.getElementById('loading').classList.contains('done')) { clearInterval(timer); return; }

    })();
